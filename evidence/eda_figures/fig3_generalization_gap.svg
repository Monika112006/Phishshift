<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380" style="background:#0f172a; font-family:sans-serif;">
  <text x="350" y="30" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">Figure 3: Model Generalization Gap on Unfamiliar Holdout Campaigns (FR-02, FR-03)</text>
  <text x="350" y="50" fill="#94a3b8" font-size="12" text-anchor="middle">Comparing In-Distribution Validation vs Out-of-Distribution Unseen Holdout Accuracy</text>

  <!-- Y Axis Grid -->
  <line x1="80" y1="280" x2="640" y2="280" stroke="#334155" stroke-width="1"/>
  <line x1="80" y1="225" x2="640" y2="225" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>
  <line x1="80" y1="170" x2="640" y2="170" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>
  <line x1="80" y1="115" x2="640" y2="115" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>
  <line x1="80" y1="60" x2="640" y2="60" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>

  <text x="70" y="284" fill="#94a3b8" font-size="11" text-anchor="end">0%</text>
  <text x="70" y="229" fill="#94a3b8" font-size="11" text-anchor="end">25%</text>
  <text x="70" y="174" fill="#94a3b8" font-size="11" text-anchor="end">50%</text>
  <text x="70" y="119" fill="#94a3b8" font-size="11" text-anchor="end">75%</text>
  <text x="70" y="64" fill="#94a3b8" font-size="11" text-anchor="end">100%</text>

  <!-- Rule-Based Heuristics -->
  <rect x="130" y="95.596" width="50" height="184.404" fill="#818cf8" rx="4"/>
  <text x="155" y="85.596" fill="#f8fafc" font-size="10.5" font-weight="bold" text-anchor="middle">83.8%</text>

  <rect x="185" y="176.93" width="50" height="103.07000000000001" fill="#f59e0b" rx="4"/>
  <text x="210" y="166.93" fill="#f8fafc" font-size="10.5" font-weight="bold" text-anchor="middle">46.9%</text>

  <text x="182" y="305" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Rule-Based</text>
  <!-- TF-IDF + Logistic Regression -->
  <rect x="310" y="59.99999999999997" width="50" height="220.00000000000003" fill="#818cf8" rx="4"/>
  <text x="335" y="49.99999999999997" fill="#f8fafc" font-size="10.5" font-weight="bold" text-anchor="middle">100.0%</text>

  <rect x="365" y="59.99999999999997" width="50" height="220.00000000000003" fill="#f59e0b" rx="4"/>
  <text x="390" y="49.99999999999997" fill="#f8fafc" font-size="10.5" font-weight="bold" text-anchor="middle">100.0%</text>

  <text x="362" y="305" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">TF-IDF</text>
  <!-- Multi-Modal Random Forest -->
  <rect x="490" y="59.99999999999997" width="50" height="220.00000000000003" fill="#818cf8" rx="4"/>
  <text x="515" y="49.99999999999997" fill="#f8fafc" font-size="10.5" font-weight="bold" text-anchor="middle">100.0%</text>

  <rect x="545" y="59.99999999999997" width="50" height="220.00000000000003" fill="#f59e0b" rx="4"/>
  <text x="570" y="49.99999999999997" fill="#f8fafc" font-size="10.5" font-weight="bold" text-anchor="middle">100.0%</text>

  <text x="542" y="305" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Multi-Modal</text>
